name: test

# 测试必须独立于发布流程：build.yml 仅由 tag push / workflow_dispatch 触发，
# 测试若挂在它下面，就只在发版时执行——2026-09 的 Windows「os error 5」回归
# 正是这样漏到 0.1.43 的。本 workflow 在 push 与 PR 上即触发。
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-tests:
    name: cargo test (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions-rust-lang/setup-rust-toolchain@v1

      # 与 build.yml 分开的 key 前缀（那边是 release profile 产物），
      # restore-keys 回落到它的缓存，以复用依赖编译产物。
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-test-
            ${{ runner.os }}-cargo-

      # 只跑 core：零 tauri 依赖，不需要 webkit / npm / 前端 dist。
      - name: Run tests
        run: cargo test -p wb-switch-core

  # 前端类型、格式与 lint 门禁。跑在 Windows 上：clippy 按宿主平台展开 cfg 分支，
  # 与项目当前唯一支持的平台一致，本地全绿即 CI 全绿。
  lint:
    name: lint (tsc + fmt + clippy)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions-rust-lang/setup-rust-toolchain@v1

      # 与 rust-tests 相同的 key 前缀，直接复用依赖编译产物。
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-test-
            ${{ runner.os }}-cargo-

      - name: Install frontend dependencies
        run: npm ci

      # tsc 顺带产出 dist：clippy 检查 src-tauri 时 tauri-build 要求 frontendDist 存在。
      - name: Type-check and build frontend
        run: npm run build

      - name: Check formatting
        run: cargo fmt --check -p wb-switch-core -p wb-switch-rust

      - name: Clippy
        run: cargo clippy -p wb-switch-core -p wb-switch-rust --all-targets --no-deps -- -D warnings

      # src-tauri 的测试（rust-tests 只覆盖 core）。
      - name: Desktop app tests
        run: cargo test -p wb-switch-rust

  # 前端行为测试：纯逻辑单测（node 环境），不依赖 Rust 工具链。
  frontend-tests:
    name: frontend-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
