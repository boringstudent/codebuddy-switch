name: build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: win-x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: x86_64-pc-windows-msvc
          rustflags: ""

      # cargo 缓存：依赖 + 编译产物，增量编译大幅提速（Cargo.lock 不变时命中）
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      # 前端构建产物（Tauri App 使用）
      - name: Build frontend
        run: |
          npm install
          npm run build
          mkdir -p dist-bin

      # 桌面 App（nsis setup exe + msi）
      - name: Build desktop app
        shell: bash
        run: |
          VER="${GITHUB_REF_NAME#v}"
          if ! [[ "$VER" =~ ^[0-9] ]]; then
            VER=$(grep '^version' src-tauri/Cargo.toml | head -1 | sed 's/.*"\(.*\)"/\1/')
          fi
          BUNDLE_ROOT="target/x86_64-pc-windows-msvc/release/bundle"
          # cargo cache 会保留旧 NSIS/MSI；不清理就会把旧版本产物带进 Release。
          rm -rf "$BUNDLE_ROOT"
          npm run tauri -- build --target x86_64-pc-windows-msvc --bundles nsis,msi
          echo "bundle after build:"
          find "$BUNDLE_ROOT" -type f | sort || true
          STALE=$(find "$BUNDLE_ROOT" -type f -name '*-setup.exe' ! -name "CodeBuddy_${VER}_x64-setup.exe" || true)
          if [ -n "$STALE" ]; then
            echo "error: stale Windows installer still present:" >&2
            printf '%s\n' "$STALE" >&2
            exit 1
          fi
          test -f "$BUNDLE_ROOT/nsis/CodeBuddy_${VER}_x64-setup.exe"
          find "$BUNDLE_ROOT" -type f \
            \( -name '*.exe' -o -name '*.msi' \) \
            -exec cp {} dist-bin/ \;

      - uses: actions/upload-artifact@v4
        with:
          name: win-x64
          path: dist-bin/
          if-no-files-found: error

  release:
    name: Publish release assets
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
